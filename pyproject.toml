[project]
name = "multitenant-rag"
version = "0.1.0"
description = "Multi-Tenant RAG Knowledge Assistant"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pymongo>=4.15.0",
    "qdrant-client>=1.19.0",
    "google-genai>=2.0.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.0",
    "asteval>=1.0.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "httpx>=0.28.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
override-dependencies = [
    "torch",
    "torchvision",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
